services:
  - type: web
    name: uniplay 
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uniplay-db
          property: connectionString

databases:
  - name: uniplay-db
    plan: free
    databaseName: uniplay
    user: uniplay_user
